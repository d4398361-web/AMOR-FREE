<!DOCTYPE html>
<html lang="en">
<head>
<title>Login | AMOR HOSTING</title>
{% include '_head.html' %}
</head>
<body class="amor">
{% include '_nav.html' %}
<main class="auth">
  <div class="glass card tilt">
    <h1 data-i18n="login_title">Welcome <span class="grad">back</span></h1>
    <p class="sub">Sign in to your hosting dashboard.</p>
    {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
    <form method="POST" class="stack">
      <div><label class="lb">Username / Email / Phone</label>
        <input class="field" type="text" name="username" required placeholder="your username" autocomplete="username"></div>
      <div><label class="lb">Password</label>
        <input class="field" type="password" name="password" required placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn btn-p block" type="submit"><i class="fas fa-right-to-bracket"></i> Sign in</button>
    </form>
    <div class="or">OR</div>
    <a href="/auth/google" class="gbtn"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google</a>
    {% if discord %}<a href="/auth/discord" class="gbtn" style="background:#5865F2;color:#fff;margin-top:10px"><i class="fab fa-discord"></i> Continue with Discord</a>{% endif %}
    <div class="or">NEW HERE?</div>
    <a href="/register" class="btn btn-g block"><i class="fas fa-user-plus"></i> Create account</a>
  </div>
</main>
<script>window.SCENE_MODE='auth';</script>
{% include '_scripts.html' %}
</body>
</html>
