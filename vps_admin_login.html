<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS Console | Sign in</title>
<link rel="icon" type="image/jpeg" href="/static/favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Sora:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090c;color:#e7ecef;font-family:'Sora',sans-serif;
background-image:linear-gradient(rgba(245,158,11,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,.05) 1px,transparent 1px);background-size:44px 44px}
.box{width:min(400px,92vw);padding:34px;border:1px solid #2a2f36;border-radius:6px;background:#0d1116;box-shadow:0 0 0 1px #000,0 30px 80px rgba(0,0,0,.6);position:relative}
.box:before{content:'';position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,#f59e0b,#10b981)}
h1{font:800 1.05rem 'JetBrains Mono';letter-spacing:.18em;margin:0 0 4px;color:#f59e0b}p{margin:0 0 22px;color:#7d8791;font-size:.82rem}
label{display:block;font:600 .68rem 'JetBrains Mono';letter-spacing:.12em;color:#7d8791;margin:14px 0 6px}
input{width:100%;background:#07090c;border:1px solid #2a2f36;border-radius:4px;color:#fff;padding:12px;font:.9rem 'JetBrains Mono'}input:focus{outline:none;border-color:#f59e0b}
button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:4px;background:#f59e0b;color:#111;font:800 .82rem 'JetBrains Mono';letter-spacing:.14em;cursor:pointer}button:hover{background:#fbbf24}
.err{background:#2a1214;border:1px solid #7f1d1d;color:#fca5a5;padding:10px;border-radius:4px;font-size:.8rem;margin-bottom:6px}
</style></head><body>
<form class="box" method="POST" action="/vps-admin/login">
  <h1>▲ VPS CONSOLE</h1><p>Restricted area. Authorised staff only.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label>OPERATOR</label><input name="username" required autocomplete="username" placeholder="admin">
  <label>PASSWORD</label><input name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
  <button>AUTHENTICATE</button>
</form></body></html>
